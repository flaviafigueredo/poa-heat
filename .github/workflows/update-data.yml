# Atualiza os dados de temperatura uma vez por mês.
# Roda o script da Open-Meteo e, se o JSON mudou, faz commit na main.
# Esse commit dispara o deploy automático do Cloudflare Pages.
# No fim, abre uma issue já fechada com o resultado, que chega por email.

name: Update temperature data

on:
  schedule:
    # Formato do cron: minuto, hora, dia do mês, mês, dia da semana.
    # "0 9 10 * *" = dia 10 de todo mês, às 9h UTC (6h em Brasília).
    # Dia 10 porque o ERA5-Land chega com alguns dias de atraso: no dia 1º,
    # os últimos dias do mês anterior ainda podem vir vazios.
    - cron: "0 9 10 * *"
  # Mostra o botão "Run workflow" na aba Actions, para rodar à mão.
  workflow_dispatch:

# Por padrão o workflow só pode ler o repositório. Este precisa escrever
# (commit do JSON) e abrir issues (aviso mensal).
permissions:
  contents: write
  issues: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Usa a mesma versão do Node do projeto, lida do .nvmrc.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Se a API falhar ou vier um dia sem valor, o script termina com erro,
      # o workflow para aqui e nada é commitado.
      - name: Fetch temperature data
        run: npm run data

      # Roda os testes com os dados novos. Se alguma conta quebrar, o workflow
      # para e nada é commitado.
      - name: Run tests
        run: npm test

      # `git diff --quiet` termina com sucesso quando não há mudança.
      # Só faz commit e push quando o JSON mudou de fato.
      # A variável DATA_CHANGED fica disponível para o step seguinte.
      - name: Commit updated data
        id: commit
        run: |
          if git diff --quiet -- src/data/temperature.json; then
            echo "Sem mudanças nos dados."
            echo "DATA_CHANGED=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/temperature.json
          git commit -m "chore(data): update temperature data"
          git push
          echo "DATA_CHANGED=true" >> "$GITHUB_OUTPUT"

      # Abre uma issue já fechada com o resultado. Como nasce fechada, não
      # polui a lista de issues abertas, mas fica de histórico e manda email.
      - name: Notify via closed issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          end_date=$(node -e "console.log(JSON.parse(require('fs').readFileSync('src/data/temperature.json','utf8')).meta.endDate)")

          if [ "${{ steps.commit.outputs.DATA_CHANGED }}" = "true" ]; then
            title="Dados atualizados até ${end_date}"
            body="O workflow atualizou o JSON e fez commit na main. O deploy é automático."
          else
            title="Sem mudanças nos dados (${end_date})"
            body="O JSON já estava atualizado. Nenhum commit foi feito."
          fi

          gh issue create --title "$title" --body "$body" | xargs gh issue close
